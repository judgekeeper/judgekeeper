# Weekly update PRs for the pinned GitHub Actions, the dev dependencies and the website's
# Docker images. judgekeeper has no runtime dependencies; the pip updates cover the [dev] extras.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /deploy/railway
    schedule:
      interval: weekly
