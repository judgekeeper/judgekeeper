# Publishes judgekeeper to PyPI when a GitHub release is published.
# Nothing else triggers it. PyPI Trusted Publishing (OIDC) authenticates the upload: there is
# no API token anywhere. PyPI and the repository's environment are set up once, by hand.
# The build job runs only the hash-pinned build tools, so nothing else can touch the files
# before they are uploaded; the tests run in their own job, on a copy.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Check the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
      - name: Install the pinned build tools
        run: python -m pip install --require-hashes --no-deps -r .github/release-requirements.txt
      - name: Build both distributions
        run: python -m build --no-isolation --outdir dist .
      - name: Check the metadata PyPI will render
        run: twine check --strict dist/*
      - name: Check the tag matches the version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$TAG" = "v$version"
          ls dist/judgekeeper-"$version"-py3-none-any.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Install the wheel into a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/judgekeeper-*.whl "pytest>=8" "pyyaml>=6" \
            "jsonschema>=4.18"
      - name: Run the installed judgekeeper outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          set -x
          venv/bin/judgekeeper --version
          venv/bin/judgekeeper --help
          venv/bin/judgekeeper mark --help
          venv/bin/python -c 'import judgekeeper; judgekeeper.record(input="q", output="a", verdict="pass")'
          ls .judgekeeper/records/*.jsonl
      - name: Run the test suite against the built wheel
        run: |
          # src/ is not on the path: every test imports the installed wheel.
          "$RUNNER_TEMP/venv/bin/python" -c 'import judgekeeper, sys; assert "site-packages" in judgekeeper.__file__, judgekeeper.__file__'
          "$RUNNER_TEMP/venv/bin/python" -m pytest -p no:cacheprovider

  publish:
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/judgekeeper/
    permissions:
      id-token: write  # Trusted Publishing: PyPI exchanges this OIDC token for a short upload token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
