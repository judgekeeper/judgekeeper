# Runs the test suite on Windows when started by hand (Actions > Windows > Run workflow).
# Windows is not yet a supported platform: several tests still expect macOS and Linux output,
# so this does not run on every push, where it would show a failing check on every change.
name: Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mlflow]"
      - name: Test
        run: pytest
