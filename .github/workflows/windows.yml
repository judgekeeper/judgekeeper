# Runs the test suite on Windows: on every pull request, on every push to main, and by hand
# (Actions > Windows > Run workflow). Windows is a supported platform, so this check must pass
# like the others.
name: Windows

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every optional extra and Node.js, like test and test-extras in ci.yml, so the Inspect,
  # MLflow and promptfoo (npx) paths run on Windows too.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mlflow,inspect]"
      - name: Test
        # -rfEs lists every failed, erroring and skipped test (and why); the TypeScript
        # snippet test may not skip here.
        env:
          JUDGEKEEPER_NEEDS_NODE: "1"
        run: pytest -rfEs

  # The oldest and newest Python the package supports, on Windows.
  test-windows-versions:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -rfEs
