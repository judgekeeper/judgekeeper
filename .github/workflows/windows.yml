# Runs the test suite on Windows: on every pull request, on every push to main, and by hand
# (Actions > Windows > Run workflow). Windows is a supported platform, so this check must pass
# like the others.
name: Windows

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mlflow]"
      - name: Test
        # -rfEs lists every failed, erroring and skipped test (and why)
        run: pytest -rfEs
