# Installs judgekeeper fresh into a new project on Windows, Linux and macOS (or runs it with
# uvx, with nothing installed in the project) and runs the whole `judgekeeper` path against
# real promptfoo, DeepEval, Inspect AI and MLflow results, a table, judgekeeper.record(), a
# results file in its own format and judges on Ollama
# (scripts/install_check.py). Every judge is a fake one the script serves: no API call, no key.
# It runs on pull requests that change the check, by hand (Actions > Install check > Run
# workflow, `source` build or pypi:VERSION) and after every release, against the release on
# PyPI. It is slow and uses outside tools, so it is not a required check for main.
name: Install check

on:
  pull_request:
    paths:
      - scripts/install_check.py
      - .github/workflows/install-check.yml
  workflow_dispatch:
    inputs:
      source:
        description: "build (a wheel built from this checkout) or pypi:VERSION"
        required: true
        default: build
        type: string
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

jobs:
  install-check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        tool: [table, promptfoo, deepeval, inspect, mlflow, record, own-format,
               promptfoo-ollama, inspect-ollama]
        python: ["3.12"]
        via: [venv]
        include:
          - {os: ubuntu-latest, tool: table, python: "3.11", via: venv}
          - {os: ubuntu-latest, tool: table, python: "3.14", via: venv}
          - {os: windows-latest, tool: table, python: "3.11", via: venv}
          - {os: windows-latest, tool: table, python: "3.14", via: venv}
          - {os: macos-latest, tool: table, python: "3.11", via: venv}
          - {os: macos-latest, tool: table, python: "3.14", via: venv}
          - {os: ubuntu-latest, tool: table, python: "3.12", via: uvx}
          - {os: ubuntu-latest, tool: promptfoo, python: "3.12", via: uvx}
          - {os: windows-latest, tool: table, python: "3.12", via: uvx}
          - {os: windows-latest, tool: promptfoo, python: "3.12", via: uvx}
          - {os: macos-latest, tool: table, python: "3.12", via: uvx}
          - {os: macos-latest, tool: promptfoo, python: "3.12", via: uvx}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        if: matrix.via == 'uvx'
      # promptfoo needs Node.js 22.22 or later.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        if: startsWith(matrix.tool, 'promptfoo')
        with:
          node-version: "22"
      - name: Choose what to install
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SOURCE: ${{ inputs.source }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          case "$EVENT" in
            workflow_dispatch) source="$INPUT_SOURCE" ;;
            workflow_run) source="pypi:${RELEASE_TAG#v}" ;;
            *) source=build ;;
          esac
          if ! [[ "$source" =~ ^(build|pypi:[0-9][0-9A-Za-z.+!-]*)$ ]]; then
            echo "source must be build or pypi:VERSION, not: $source"
            exit 1
          fi
          echo "SOURCE=$source" >> "$GITHUB_ENV"
      - name: Install the build tool
        if: env.SOURCE == 'build'
        run: python -m pip install --upgrade pip build
      - name: Run the install check
        shell: bash
        env:
          PYTHONUTF8: "1"
          TOOL: ${{ matrix.tool }}
          VIA: ${{ matrix.via }}
        run: python scripts/install_check.py --tool "$TOOL" --via "$VIA" --source "$SOURCE" --work "$RUNNER_TEMP/install check"
