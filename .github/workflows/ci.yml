name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # Node.js 22.18 or later runs the TypeScript record() snippet in docs/reference.md as it is.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      - name: Install
        # The mlflow extra lets tests/test_import_mlflow.py build and read a real MLflow store.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mlflow]"
      - name: Test
        # -rfEs lists every failed, erroring and skipped test (and why); the TypeScript
        # snippet test may not skip here.
        env:
          JUDGEKEEPER_NEEDS_NODE: "1"
        run: pytest -rfEs
      - name: Lint
        run: ruff check src tests

  # Builds both distributions, installs the wheel into a fresh venv and runs it from there,
  # so a packaging mistake (a missing font, a broken entry point) fails here rather than
  # on release day. The same steps run in release.yml before publishing.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Build both distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --outdir dist .
          twine check --strict dist/*
      - name: Install the wheel into a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/judgekeeper-*.whl
      - name: Run the installed judgekeeper outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          set -x
          venv/bin/judgekeeper --version
          venv/bin/judgekeeper --help
          venv/bin/judgekeeper start --help
          venv/bin/judgekeeper setup --help
          venv/bin/python -c 'import judgekeeper; judgekeeper.record(input="q", output="a", verdict="pass")'
          ls .judgekeeper/records/*.jsonl
      - name: Run the test suite against the installed wheel
        run: |
          "$RUNNER_TEMP/venv/bin/pip" install "pytest>=8" "pyyaml>=6" "jsonschema>=4.18"
          "$RUNNER_TEMP/venv/bin/python" -c 'import judgekeeper, sys; assert "site-packages" in judgekeeper.__file__, judgekeeper.__file__'
          "$RUNNER_TEMP/venv/bin/python" -m pytest -p no:cacheprovider
