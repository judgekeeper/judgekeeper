name: Something went wrong
description: judgekeeper did something you did not expect.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste API keys, or answers and data you are not allowed to share. Use made-up text instead.
  - type: textarea
    id: ran
    attributes:
      label: What you ran
      description: The command, and the folder you ran it in if it matters.
      placeholder: judgekeeper check
      render: shell
    validations:
      required: true
  - type: textarea
    id: saw
    attributes:
      label: What it printed
      description: Paste it as text, not a picture, if you can.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: judgekeeper version
      description: What `judgekeeper --version` prints. At a terminal its first line is "✓ judgekeeper 1.0.0 is ready".
      placeholder: ✓ judgekeeper 1.0.0 is ready
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Your eval tool
      options:
        - promptfoo
        - DeepEval
        - Inspect AI
        - MLflow
        - A CSV, TSV or JSONL file
        - judgekeeper.record() in my own code
        - Another results file
        - None of these
    validations:
      required: true
  - type: input
    id: tool-version
    attributes:
      label: Your eval tool's version
      description: Write "none" if you have no eval tool.
      placeholder: promptfoo 0.124.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Your computer
      description: The system and its version, and the Python version.
      placeholder: macOS 15, Python 3.13
  - type: checkboxes
    id: agree
    attributes:
      label: Before you send it
      options:
        - label: I removed any answer text I can't share.
          required: true
        - label: Any code, design or text I share here may be used in judgekeeper under the Apache-2.0 license.
          required: true
