[project]
name = "judgekeeper"
version = "0.2.0"
description = "Check your LLM-as-a-judge: see how often it agrees with human labels."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Sathvik Thota" }]
keywords = ["llm", "evaluation", "evals", "llm-evaluation", "llm-as-a-judge", "llm-as-judge", "llm-judge", "human-labels", "custom-metric", "rubric", "calibration", "drift"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pytest",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
# build, hatchling and pyyaml: tests/test_release.py builds the wheels and reads the workflows.
dev = ["pytest>=8", "ruff>=0.6", "build>=1", "hatchling>=1.26", "pyyaml>=6"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
inspect = ["inspect-ai>=0.3"]
mlflow = ["mlflow>=3.1"]

[project.scripts]
judgekeeper = "judgekeeper.cli:main"

[project.urls]
Homepage = "https://www.judgekeeper.com"
Source = "https://github.com/judgekeeper/judgekeeper"
Changelog = "https://github.com/judgekeeper/judgekeeper/blob/main/CHANGELOG.md"

[project.entry-points.pytest11]
judgekeeper = "judgekeeper.pytest_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/judgekeeper"]

[tool.hatch.build.targets.sdist]
# Only what a user of the package needs: no docs, website, tests or fixtures.
include = ["/src/judgekeeper", "/README.md", "/LICENSE", "/CHANGELOG.md", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
