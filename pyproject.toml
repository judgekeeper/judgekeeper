[project]
name = "judgekeeper"
version = "1.0.0"
description = "Check your LLM-as-a-judge in 5 steps."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Sathvik Thota" }]
keywords = ["llm", "evaluation", "evals", "llm-evaluation", "llm-as-a-judge", "llm-as-judge", "llm-judge", "human-labels", "custom-metric", "rubric", "calibration", "drift"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
# build, hatchling and pyyaml: tests/test_release.py builds the wheels and reads the workflows.
dev = ["pytest>=8", "ruff>=0.6", "build>=1", "hatchling>=1.26", "pyyaml>=6",
       "jsonschema>=4.18"]
inspect = ["inspect-ai>=0.3"]
mlflow = ["mlflow>=3.1"]

[project.scripts]
judgekeeper = "judgekeeper.__main__:main"

[project.urls]
Homepage = "https://www.judgekeeper.com"
Guide = "https://www.judgekeeper.com/start.html"
Reference = "https://github.com/judgekeeper/judgekeeper/blob/main/docs/reference.md"
Source = "https://github.com/judgekeeper/judgekeeper"
Issues = "https://github.com/judgekeeper/judgekeeper/issues"
Changelog = "https://github.com/judgekeeper/judgekeeper/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/judgekeeper"]

[tool.hatch.build.targets.sdist]
# Only what a user of the package needs: no docs, website, tests or fixtures.
include = ["/src/judgekeeper", "/README.md", "/LICENSE", "/TRADEMARKS.md", "/CHANGELOG.md",
           "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The practice release (testpypi.yml) builds 1.0.0rcN and runs every other test.
markers = ["version_number: checks the version number itself, as main has it"]

[tool.ruff]
line-length = 100
target-version = "py311"
