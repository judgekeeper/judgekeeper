name: judgekeeper check
description: When your LLM-as-a-judge changes, re-check it on the answers you marked.
branding:
  icon: check-circle
  color: blue

# Exit codes are `judgekeeper check`'s: 0 no change or no drop seen, 1 worse in a group of your
# marks, 3 your judge changed and needs `judgekeeper check` (fast) or could not be re-checked.
# Run it after the step that runs your eval, so the newest results are in the checkout.
inputs:
  mode:
    description: >-
      fast: say whether your judge changed, with no AI call. Needs only .judgekeeper/judge.json
      and .judgekeeper/history.jsonl committed (judgekeeper commits them for you). full: also
      re-check a changed judge on your marks. Needs .judgekeeper/start.json, marks.jsonl and
      pool.jsonl committed too (pool.jsonl holds your answers' text) and the key your judge
      uses set in `env` from a secret; your workflow is then the permission to ask your judge.
    required: false
    default: fast
  path:
    description: Your project folder.
    required: false
    default: "."
  python-version:
    description: >-
      Python to run judgekeeper with. Empty: the Python already set up in your job, where your
      eval tool is installed (needed for Inspect AI and MLflow results).
    required: false
    default: "3.12"
  version:
    description: >-
      The judgekeeper version to install from PyPI. Empty: the judgekeeper this action comes
      from (the tag you pin the action to).
    required: false
    default: ""

outputs:
  exit-code:
    description: The exit code of `judgekeeper check`, which is also the action's.
    value: ${{ steps.check.outputs.exit-code }}

runs:
  using: composite
  steps:
    - if: inputs.python-version != ''
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install judgekeeper
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        VERSION: ${{ inputs.version }}
      run: |
        if [ -n "$VERSION" ]; then
          python -m pip install --quiet --disable-pip-version-check "judgekeeper==$VERSION"
        else
          python -m pip install --quiet --disable-pip-version-check "$ACTION_PATH"
        fi

    - name: Check your judge
      id: check
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        PROJECT: ${{ inputs.path }}
      run: |
        case "$MODE" in
          fast) how=--fast ;;
          full) how=--ci ;;
          *) echo "::error title=judgekeeper::mode is '$MODE'; use fast or full."; exit 2 ;;
        esac
        set +e
        python -m judgekeeper check "$how" "$PROJECT" > "$RUNNER_TEMP/judgekeeper.txt" 2>&1
        code=$?
        set -e
        cat "$RUNNER_TEMP/judgekeeper.txt"
        if [ -s "$RUNNER_TEMP/judgekeeper.txt" ]; then
          { echo '```'; cat "$RUNNER_TEMP/judgekeeper.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        fi
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit "$code"
